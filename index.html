<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UGT · El Corte Inglés · Gran Canaria</title>

<meta property="og:title" content="UGT · El Corte Inglés · Gran Canaria"/>
<meta property="og:description" content="Acceso directo a los canales oficiales de cada centro."/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://ugtecicana.github.io/grancanaria/"/>
<meta property="og:image" content="https://ugtecicana.github.io/grancanaria/logo2.jpg"/>

<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="https://ugtecicana.github.io/grancanaria/logo2.jpg"/>

<style>
:root {
    --red: #d50000;
    --text: #111111;
    --soft: #444444;
    --bg: #f2f2f2;
    --border: #dcdcdc;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.card {
    background: #ffffff;
    width: 100%;
    max-width: 440px;
    border-radius: 24px;
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.12);
    padding: 26px 20px 28px;
    text-align: center;
    border-top: 6px solid var(--red);
}

.logo img {
    max-width: 100%;
    height: auto;
    margin-bottom: 10px;
}

h1 {
    font-size: 30px;
    line-height: 1.15;
    margin: 10px 0 10px;
    color: var(--text);
}

.intro {
    font-size: 15px;
    line-height: 1.45;
    color: var(--soft);
    margin: 0 0 26px;
}

.buttons {
    display: grid;
    gap: 14px;
}

.btn {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 18px;
    background: #ffffff;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
    text-align: center;
    cursor: pointer;
    font-size: 19px;
    font-weight: 700;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}

.btn:hover {
    transform: translateY(-2px) scale(1.01);
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
    border-color: #cccccc;
}

.btn:active {
    transform: scale(0.99);
}

.dot {
    color: var(--red);
    font-size: 16px;
    line-height: 1;
}

.footer {
    margin-top: 22px;
    font-size: 11px;
    color: #888888;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

@media (max-width: 480px) {
    body {
        padding: 14px;
    }

    .card {
        padding: 22px 18px 26px;
        border-radius: 22px;
    }

    h1 {
        font-size: 27px;
    }

    .btn {
        font-size: 18px;
        padding: 21px 16px;
    }
}
</style>
</head>

<body>
<div class="card">
    <div class="logo">
        <img src="logo.jpg" alt="UGT Canarias - El Corte Inglés"/>
    </div>

    <h1>Selecciona tu centro</h1>

    <div class="intro">
        Accede a la información de tu centro.
    </div>

    <div class="buttons">
        <a class="btn" href="https://ugtecicana.github.io/enlaces" aria-label="Acceder a Mesa y López">
            <span class="dot">●</span>
            <span>Mesa y López</span>
        </a>

        <a class="btn" href="https://ugtecicana.github.io/enlaces7p" aria-label="Acceder a 7 Palmas y Outlets">
            <span class="dot">●</span>
            <span>7 Palmas / Outlets</span>
        </a>
    </div>

    <div class="footer">
        U.G.T · EL CORTE INGLÉS · GRAN CANARIA
    </div>
</div>
</body>
</html>
